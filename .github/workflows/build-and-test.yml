name: Node.js CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: List directory contents
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            dir
          else
            ls -la
          fi

      - name: Create directory
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mkdir test_dir
          else
            mkdir -p test_dir
          fi