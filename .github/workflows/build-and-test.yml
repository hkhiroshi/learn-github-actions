name: Node.js CI

on:
  push:
    branches: [main]

jobs:
  custom-error-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Check requirements
        run: |
          if [ ! -f "config.json" ]; then
            echo "::error::Required file config.json is missing"
            exit 1
          fi

      - name: Validate input
        run: |
          if [[ -z "${{ github.event.inputs.version }}" ]]; then
            echo "::error::Version parameter is required"
            exit 1
          fi

      - name: Process with validation
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::warning::This action is recommended to run on main branch"
          fi
          echo "Processing with version ${{ github.event.inputs.version }}"