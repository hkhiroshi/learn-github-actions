name: Node.js CI

on:
  push:
    branches: [main]

jobs:
  error-response:
    runs-on: ubuntu-latest
    steps:
      - name: Main process
        id: main
        run: |
          echo "Running main process"
          exit 1

      - name: Error notification
        if: failure()
        run: |
          echo "Main process failed"
          echo "Sending notification to team"

      - name: Cleanup
        if: always()
        run: |
          echo "Performing cleanup"
          echo "This runs regardless of previous step results"